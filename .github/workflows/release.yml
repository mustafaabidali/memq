name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install the release target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Check the release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          PACKAGE_VERSION="$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: Build and smoke-test the release binary
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --locked --release --bin memq --target "$TARGET"
          BINARY="target/$TARGET/release/memq"
          test "$("$BINARY" --version)" = "memq ${RELEASE_TAG#v}"
          "$BINARY" --help
      - name: Collect dependency license notices
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/collect_licenses.py --target "$TARGET" --output dist/licenses
      - name: Package the binary
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE="memq-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$PACKAGE"
          cp "target/$TARGET/release/memq" LICENSE "dist/$PACKAGE/"
          cp -R dist/licenses "dist/$PACKAGE/THIRD_PARTY_LICENSES"
          tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memq-${{ matrix.target }}
          path: dist/memq-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Prepare draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: memq-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name 'memq-*.tar.gz' | wc -l)" -eq 2
          sha256sum memq-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/memq-*.tar.gz
            dist/SHA256SUMS
