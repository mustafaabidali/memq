[package]
name = "memq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded project briefings and attributable memory for Git repositories"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/packaging/*.py",
    "/tests/fixtures/**/*.json",
    "/tests/fixtures/**/*.jsonl",
    "/tests/fixtures/**/*.toml",
    "/tests/fixtures/**/*.md",
    "/tests/fixtures/**/*.sql",
    "/tests/fixtures/**/*.py",
    "/tests/fixtures/**/*.ts",
    "/tests/fixtures/**/*.tsx",
    "/examples/*.rs",
    "/examples/*.py",
    "/examples/harness/*.ts",
    "/examples/harness/*.json",
    "/examples/harness/*.md",
    "/scripts/*.sh",
    "/scripts/*.py",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/SECURITY.md",
    "/docs/usage.md",
    "/docs/releasing.md",
]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = "0.7"
toml = "0.9"
ulid = { version = "3", features = ["serde"] }
unicode-normalization = "0.1"
usearch = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[[bin]]
name = "memq"
path = "src/main.rs"
